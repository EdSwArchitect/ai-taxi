# Grafana dashboard provisioning configuration
# Automatically loads dashboards from the dashboards directory
# This file should be mounted at /etc/grafana/provisioning/dashboards/

apiVersion: 1

providers:
  - name: 'Default'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    editable: true
    allowUiUpdates: true
    options:
      # Path where dashboard JSON files are located
      # This path is inside the Grafana container
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false

